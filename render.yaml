services:
  - type: web
    name: semantic-router-chat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt && python -m scripts.seed
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: groq/compound-mini
      - key: GROQ_INTENT_MODEL
        value: qwen/qwen3.6-27b
      - key: INTENT_CLASSIFIER_PROVIDER
        value: groq
      - key: LLM_PRIMARY_PROVIDER
        value: groq
      - key: TAVILY_CACHE_TTL_SECONDS
        value: "600"
      - key: EMBEDDING_MODEL_NAME
        value: BAAI/bge-small-en-v1.5
      # Hashing keeps the free Render instance within its memory limit.
      - key: EMBEDDING_BACKEND
        value: hashing
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_data
      - key: ROUTER_TOP_K
        value: "6"
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGSMITH_PROJECT
        value: semantic-router-chat