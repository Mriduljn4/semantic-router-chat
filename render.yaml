services:
  - type: web
    name: semantic-router-chat
    runtime: python
    plan: free
    buildCommand: pip install -e . && python -m scripts.seed
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "false"
      - key: EMBEDDING_BACKEND
        value: hashing